{% extends "hubspace/base.html" %}

{% block content %}
    <ul>
        <p>Here are a few of our most popular users...</p>
        {% for profile in profiles %}
            <li><a href="{% url 'hubspace:profile_page' profile.id %}">{{ profile.firstName }}</a></li>
        {% endfor %}
    </ul>


    <p id="demo" style="display:none">Hello JavaScript!</p>

    <button type="button" onclick="document.getElementById('demo').style.display='block'">Click Me!</button>
{% endblock content %}
